<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovelAI 画室</title>
<style>
  :root{
    --bg:#0a0c11; --panel:#12151d; --panel2:#171b25; --line:#242a38;
    --text:#e9ecf4; --dim:#8b93a7; --accent:#7c5cff; --accent2:#3ba0ff;
    --ok:#35d39a; --warn:#ffb020; --err:#ff5c7a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1a2040 0%,transparent 60%),var(--bg);
    color:var(--text);font:14px/1.55 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden
  }
  header{
    display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
    background:rgba(12,14,20,.75);backdrop-filter:blur(10px);flex:none
  }
  .logo{font-size:16px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
  .logo i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-block}
  .pill{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill b{color:var(--text);font-weight:600}
  .spacer{flex:1}
  button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;transition:.15s}
  button:hover{border-color:#39415a;background:#1c2130}
  button:disabled{opacity:.45;cursor:not-allowed}
  .ghost{background:transparent}
  main{flex:1;display:grid;grid-template-columns:352px 1fr;min-height:0}
  .side{border-right:1px solid var(--line);padding:16px;overflow:auto;background:rgba(18,21,29,.6)}
  .label{font-size:12px;color:var(--dim);margin:14px 0 6px;display:flex;align-items:center;justify-content:space-between}
  .label:first-child{margin-top:0}
  textarea,input,select{
    width:100%;background:#0d1017;border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:10px 12px;font:inherit;outline:none;transition:.15s
  }
  textarea{resize:vertical;min-height:96px;line-height:1.6}
  textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8b93a7 50%),linear-gradient(135deg,#8b93a7 50%,transparent 50%);
    background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  #go{
    width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;font-weight:700;font-size:15px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    box-shadow:0 8px 24px -8px rgba(124,92,255,.8)
  }
  #go:hover{filter:brightness(1.08)}
  #go:disabled{filter:grayscale(.6);box-shadow:none}
  .hint{font-size:12px;color:var(--dim);margin-top:10px;text-align:center}
  .stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
  .canvas{flex:1;overflow:auto;padding:20px;display:flex;align-items:center;justify-content:center;min-height:0}
  .empty{text-align:center;color:var(--dim);max-width:420px}
  .empty h2{color:var(--text);font-size:18px;margin:0 0 8px}
  .empty .kbd{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:0 2px}
  .frame{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
  .frame img{max-width:100%;max-height:calc(100vh - 300px);border-radius:14px;box-shadow:0 20px 60px -20px #000;display:block}
  .frame .tag{
    position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
    padding:4px 9px;border-radius:8px;font-size:12px;color:#cfd6e6
  }
  .progress{position:absolute;left:0;right:0;bottom:0;padding:10px 20px 14px;background:linear-gradient(transparent,rgba(10,12,17,.9))}
  .bar{height:6px;border-radius:99px;background:#1e2432;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s ease}
  .prow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
  .gallery{flex:none;border-top:1px solid var(--line);padding:12px 20px 16px;max-height:190px;overflow:auto;background:rgba(12,14,20,.6)}
  .gallery h3{font-size:12px;color:var(--dim);margin:0 0 10px;font-weight:500;display:flex;gap:10px;align-items:center}
  .thumbs{display:flex;gap:10px;flex-wrap:wrap}
  .thumb{position:relative;width:86px;height:118px;border-radius:9px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:#0d1017;flex:none}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
  .thumb:hover img{transform:scale(1.06)}
  .thumb .t{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:3px 5px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#cfd6e6;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thumb .a{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.6);border-radius:6px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:#1b2030;border:1px solid var(--line);padding:10px 16px;border-radius:10px;transition:.25s;z-index:50;max-width:70vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:#5a2432;color:#ffc2cd}
  dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:22px;width:460px;max-width:92vw}
  dialog::backdrop{background:rgba(5,7,11,.7);backdrop-filter:blur(3px)}
  dialog h2{margin:0 0 4px;font-size:16px}
  dialog p{margin:0 0 16px;color:var(--dim);font-size:12px}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--dim);margin-right:6px}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--err)} .dot.wait{background:var(--warn)}
  @media (max-width:900px){main{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);max-height:52vh}}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>NovelAI 画室</div>
  <span class="pill" id="acct"><span class="dot wait"></span>检查账号…</span>
  <span class="spacer"></span>
  <button class="ghost" id="btnRefresh">刷新</button>
  <button class="ghost" id="btnSettings">设置</button>
</header>

<main>
  <section class="side">
    <div class="label">模型<span id="modelHint"></span></div>
    <select id="model"></select>

    <div class="label">画面尺寸</div>
    <select id="size"></select>

    <div class="label">正面提示词 <span id="promptLen">0</span></div>
    <textarea id="prompt" placeholder="1girl, solo, silver hair, detailed eyes, cinematic lighting, masterpiece…"></textarea>

    <div class="label">负面提示词 <span style="font-size:11px;cursor:pointer;color:#6f7891" id="resetNeg">恢复默认</span></div>
    <textarea id="negative" style="min-height:64px;font-size:12.5px"></textarea>

    <div class="row3">
      <div><div class="label">步数</div><input id="steps" type="number" min="1" max="50" value="28"></div>
      <div><div class="label">CFG</div><input id="scale" type="number" min="1" max="10" step="0.5" value="5"></div>
      <div><div class="label">张数</div><input id="n" type="number" min="1" max="4" value="1"></div>
    </div>

    <div class="row">
      <div><div class="label">采样器</div><select id="sampler"></select></div>
      <div><div class="label">种子</div><input id="seed" type="number" placeholder="随机"></div>
    </div>

    <button id="go">生成</button>
    <div class="hint">Ctrl + Enter 也能生成 · 首张 10~30 秒</div>
  </section>

  <section class="stage">
    <div class="canvas" id="canvas">
      <div class="empty" id="empty">
        <h2>画点什么</h2>
        <p>左边写提示词，点生成。<br>点了生成之后，这里会先出现草稿预览，最后给成品 PNG。</p>
        <p><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span></p>
      </div>
      <div class="frame" id="frame" style="display:none">
        <span class="tag" id="frameTag"></span>
        <img id="preview" alt="">
      </div>
    </div>
    <div class="progress" id="progress" style="display:none">
      <div class="prow"><span id="pStatus">准备中…</span><span id="pPct">0%</span></div>
      <div class="bar"><i id="pBar"></i></div>
    </div>
    <div class="gallery">
      <h3>历史 <span id="histCount" style="color:#5b6478"></span></h3>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </section>
</main>

<dialog id="settings">
  <h2>设置</h2>
  <p>改动会写进 ~/.dsh/novelai.json，插件和这个页面共用同一份配置。</p>
  <div class="label">API Key</div>
  <input id="cfgKey" type="password" placeholder="pst-…（留空表示不修改）">
  <div class="label">代理（国内必须）</div>
  <input id="cfgProxy" placeholder="留空=直连；墙内填 http://127.0.0.1:7890">
  <div class="label">保存目录</div>
  <input id="cfgOut" placeholder="C:\Users\xxx\nai-output">
  <div class="actions">
    <button class="ghost" id="cfgCancel">取消</button>
    <button class="primary" id="cfgSave">保存</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const base = (() => {
  let p = location.pathname;
  if (!p.endsWith('/')) p = p.replace(/\/[^/]*$/, '/');
  return p === '//' ? '/' : p;
})();

let meta = null;
let busy = false;

function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.className = 'toast'), 3600);
}

async function api(path, opts) {
  const r = await fetch(base + path, opts);
  const j = await r.json().catch(() => ({ ok: false, error: 'HTTP ' + r.status }));
  if (!r.ok && j.error) throw new Error(j.error);
  return j;
}

async function loadMeta() {
  meta = await api('api/meta');
  const sel = $('model');
  sel.innerHTML = meta.models.filter(m => m.id.startsWith('nai-diffusion-4') || m.id === 'nai-diffusion-3')
    .map(m => `<option value="${m.id}">${m.label} — ${m.hint}</option>`).join('');
  sel.value = meta.defaults.model;
  $('size').innerHTML = meta.sizes.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  $('size').value = meta.defaults.width + 'x' + meta.defaults.height;
  $('sampler').innerHTML = meta.samplers.map(s => `<option value="${s}">${s}</option>`).join('');
  $('sampler').value = meta.defaults.sampler;
  $('steps').value = meta.defaults.steps;
  $('scale').value = meta.defaults.scale;
  $('negative').value = meta.defaults.negative || '';
  $('cfgProxy').value = meta.defaults.proxy || '';
  $('cfgOut').value = meta.defaults.outDir || '';
  if (!meta.defaults.hasKey) toast('还没配 API Key，先点右上角「设置」', true);
}

async function loadStatus() {
  const el = $('acct');
  try {
    const s = await api('api/status');
    if (!s.ok) { el.innerHTML = '<span class="dot bad"></span>' + (s.error || '账号不可用'); return; }
    const exp = s.expiresAt ? new Date(s.expiresAt * 1000).toLocaleDateString('zh-CN') : '—';
    el.innerHTML = `<span class="dot ok"></span><b>${s.tierName}</b> · ${s.unlimited ? '不限量' : '用量 ' + (s.usage ?? '?') + '%'} · 到期 ${exp}`;
  } catch (e) {
    el.innerHTML = '<span class="dot bad"></span>' + e.message;
  }
}

function renderHistory(items) {
  const box = $('thumbs');
  $('histCount').textContent = items.length ? items.length + ' 组' : '';
  box.innerHTML = items.flatMap(it => (it.urls || []).map((u, i) => `
    <div class="thumb" title="${(it.prompt || '').replace(/"/g, '&quot;').slice(0, 400)}">
      <img loading="lazy" src="${base}${u.url}" alt="">
      <div class="a">⤓</div>
      <div class="t">${it.modelLabel || ''} · ${it.width}×${it.height}</div>
    </div>`)).join('');
  [...box.querySelectorAll('.thumb')].forEach((el, i) => {
    const img = el.querySelector('img');
    el.onclick = (ev) => {
      if (ev.target.classList.contains('a')) { download(img.src, img.src.split('/').pop()); return; }
      showImage(img.src, '历史');
    };
  });
}

function download(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name || 'novelai.png';
  document.body.appendChild(a); a.click(); a.remove();
}

function showImage(src, tag) {
  $('empty').style.display = 'none';
  $('frame').style.display = 'flex';
  $('preview').src = src;
  $('frameTag').textContent = tag;
}

function setProgress(pct, text) {
  $('progress').style.display = 'block';
  $('pBar').style.width = Math.max(0, Math.min(100, pct)) + '%';
  $('pPct').textContent = Math.round(pct) + '%';
  $('pStatus').textContent = text;
}

async function generate() {
  if (busy) return;
  const prompt = $('prompt').value.trim();
  if (!prompt) return toast('先写提示词', true);
  const payload = {
    prompt,
    negative: $('negative').value.trim(),
    model: $('model').value,
    size: $('size').value,
    steps: +$('steps').value,
    scale: +$('scale').value,
    n: +$('n').value,
    sampler: $('sampler').value,
    seed: $('seed').value === '' ? undefined : +$('seed').value,
  };
  busy = true;
  $('go').disabled = true;
  $('go').textContent = '生成中…';
  $('empty').style.display = 'none';
  $('frame').style.display = 'flex';
  $('frameTag').textContent = '草稿';
  setProgress(2, '连接 NovelAI…');
  const t0 = Date.now();

  try {
    const r = await fetch(base + 'api/generate', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || 'HTTP ' + r.status);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', done = false, err = null, files = [], metaOut = null;
    while (true) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) !== -1) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = raw.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.type === 'progress') {
          const pct = 4 + (ev.step / Math.max(1, ev.total)) * 90;
          setProgress(pct, `第 ${ev.step}/${ev.total} 步 · ${((Date.now() - t0) / 1000).toFixed(1)}s`);
        } else if (ev.type === 'preview') {
          $('preview').src = ev.dataUrl;
          $('frameTag').textContent = '草稿 · 还在画';
        } else if (ev.type === 'done') {
          done = true;
          if (!ev.ok) err = ev.error; else { files = ev.files; metaOut = ev.meta; }
        }
      }
    }
    if (err) throw new Error(err);
    if (!done || !files.length) throw new Error('没拿到图（流提前断了）');
    setProgress(100, `完成 · ${((Date.now() - t0) / 1000).toFixed(1)}s`);
    showImage(base + files[0].url, `${metaOut.modelLabel} · ${metaOut.width}×${metaOut.height} · seed ${metaOut.seed ?? '随机'}`);
    setTimeout(() => ($('progress').style.display = 'none'), 1200);
    if (files.length > 1) toast(`共 ${files.length} 张，点历史里的小图看大图`);
    loadHistory();
  } catch (e) {
    setProgress(0, '失败：' + e.message);
    toast(e.message, true);
  } finally {
    busy = false;
    $('go').disabled = false;
    $('go').textContent = '生成';
  }
}

async function loadHistory() {
  try { renderHistory((await api('api/history')).items || []); } catch {}
}

$('go').onclick = generate;
$('prompt').oninput = () => ($('promptLen').textContent = $('prompt').value.length);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); generate(); }
});
$('btnRefresh').onclick = () => { loadStatus(); loadHistory(); };
$('btnSettings').onclick = async () => {
  const c = await api('api/config');
  $('cfgProxy').value = c.proxy || '';
  $('cfgOut').value = c.outDir || '';
  $('cfgKey').value = '';
  $('cfgKey').placeholder = c.hasKey ? '已保存（留空 = 不修改）' : 'pst-…';
  $('settings').showModal();
};
$('cfgCancel').onclick = () => $('settings').close();
$('cfgSave').onclick = async () => {
  const patch = { proxy: $('cfgProxy').value.trim(), outDir: $('cfgOut').value.trim() };
  const k = $('cfgKey').value.trim();
  if (k) patch.apiKey = k;
  try {
    await api('api/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(patch) });
    $('settings').close();
    toast('已保存');
    loadStatus();
  } catch (e) { toast(e.message, true); }
};
$('resetNeg').onclick = () => { $('negative').value = 'lowres, bad anatomy, bad hands, text, error, missing finger, extra digits, cropped, worst quality, low quality, bad score, average score, signature, watermark, username, blurry'; };

(async () => {
  try {
    await loadMeta();
    loadStatus();
    loadHistory();
  } catch (e) { toast('初始化失败：' + e.message, true); }
})();
</script>
</body>
</html>
